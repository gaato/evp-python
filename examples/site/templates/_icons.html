{# Decorative status icons; the text next to each icon carries the meaning. #}
{% macro icon(name, size="size-6") -%}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="{{ size }} shrink-0" aria-hidden="true" focusable="false">
{%- if name == "info" %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == "warning" %}<path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5M12 17.5h.01"/>
{%- elif name == "success" %}<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9.5"/>
{%- elif name == "error" %}<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
{%- endif -%}
</svg>
{%- endmacro %}
